<!-- Browser-tab icon (Next.js serves app/icon.svg automatically).
     The same atom as app/components/Atom.tsx, with a cream disc behind it so
     it shows up on both light and dark tab bars. Colors are written out here
     because a favicon can't read the app's CSS. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <circle cx="24" cy="24" r="23.5" fill="#fbf5e6"/>
  <g fill="none" stroke="#187777" stroke-width="3.2">
    <ellipse cx="24" cy="24" rx="19" ry="7.5"/>
    <ellipse cx="24" cy="24" rx="19" ry="7.5" transform="rotate(60 24 24)"/>
    <ellipse cx="24" cy="24" rx="19" ry="7.5" transform="rotate(120 24 24)"/>
  </g>
  <circle cx="24" cy="24" r="5" fill="#e36d30"/>
  <circle cx="43" cy="24" r="3" fill="#e0a526"/>
  <circle cx="14.5" cy="40.5" r="3" fill="#e0a526"/>
  <circle cx="14.5" cy="7.5" r="3" fill="#e0a526"/>
</svg>
